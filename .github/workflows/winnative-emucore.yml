name: emucore

on:
  workflow_dispatch:
  push:
    branches: [winnative]

permissions:
  contents: write

env:
  NDK_VERSION: 27.3.13750724
  ABI: arm64-v8a
  PLATFORM: android-26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Full history and tags: Dolphin derives its version from git describe, and
      # RetroAchievements rejects a build whose version it cannot parse. A shallow
      # checkout has no tags, so describe returns a bare hash.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install toolchain
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake
          echo "NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -G Ninja -B build-android -S . \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" -DANDROID_PLATFORM="$PLATFORM" \
            -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ANALYTICS=OFF \
            -DENABLE_AUTOUPDATE=OFF \
            -DENABLE_TESTS=OFF \
            -DUSE_RETRO_ACHIEVEMENTS=ON

      - name: Build
        run: ninja -C build-android main hook_impl main_hook gsl_alloc_hook file_redirect_hook

      - name: Collect
        run: |
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist
          for t in main hook_impl main_hook gsl_alloc_hook file_redirect_hook; do
            so="$(find build-android -name "lib${t}.so" | head -1)"
            if [ -z "$so" ]; then
              echo "lib${t}.so not produced" >&2
              exit 1
            fi
            "$STRIP" --strip-unneeded "$so" -o "dist/lib${t}.so"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: emucore
          path: dist/*.so
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "arm64-v8a build from ${GITHUB_SHA}"
          fi
          gh release upload "$tag" dist/*.so --clobber
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title latest --notes "Rolling build."
          fi
          gh release upload latest dist/*.so --clobber
          gh release edit latest --notes "Rolling; newest immutable tag: $tag"
          echo "$tag"
