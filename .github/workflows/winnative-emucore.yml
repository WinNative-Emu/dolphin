name: emucore

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [winnative]

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: winnative
  NDK_VERSION: 27.3.13750724
  ABI: arm64-v8a
  PLATFORM: android-26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Full history and tags: Dolphin derives its version from git describe, and
      # RetroAchievements rejects a build whose version it cannot parse. A shallow
      # checkout has no tags, so describe returns a bare hash.
      - uses: actions/checkout@v4
        with:
          ref: winnative
          fetch-depth: 0
          submodules: recursive

      - name: Sync upstream
        id: sync
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent=$(gh repo view "$GITHUB_REPOSITORY" --json parent --jq 'if .parent then .parent.owner.login + "/" + .parent.name else "" end')
          if [ -z "$parent" ]; then
            echo "No upstream parent; building the branch as-is."
            exit 0
          fi
          branch=$(gh repo view "$parent" --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "upstream $parent@$branch"
          git config user.name "winnative-ci"
          git config user.email "ci@winnative.dev"
          git remote add upstream "https://github.com/$parent.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/$parent.git"
          git fetch --no-tags upstream "$branch"
          before=$(git rev-parse HEAD)
          git merge --no-edit "upstream/$branch"
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git submodule update --init --recursive
          git push origin "HEAD:$SYNC_BRANCH"
          echo "Merged $(git rev-list --count $before..$after) upstream commit(s)."

      - name: Install toolchain
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake
          echo "NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: |
          cmake -G Ninja -B build-android -S . \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" -DANDROID_PLATFORM="$PLATFORM" \
            -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ANALYTICS=OFF \
            -DENABLE_AUTOUPDATE=OFF \
            -DENABLE_TESTS=OFF \
            -DUSE_RETRO_ACHIEVEMENTS=ON

      - name: Build
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: ninja -C build-android main

      - name: Collect
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: |
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist
          so="$(find build-android -name "libmain.so" | head -1)"
          if [ -z "$so" ]; then
            echo "libmain.so not produced" >&2
            exit 1
          fi
          "$STRIP" --strip-unneeded "$so" -o "dist/libmain.so"
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        with:
          name: emucore
          path: dist/*.so
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=0
          for f in dist/*.so; do
            name=$(basename "$f")
            prev=$(mktemp -d)/"$name"
            if gh release download latest --pattern "$name" --output "$prev" 2>/dev/null && cmp -s "$prev" "$f"; then
              echo "$name unchanged"
            else
              echo "$name changed"
              changed=1
            fi
          done
          if [ "$changed" = "0" ]; then
            echo "Every artifact is byte-identical to the published release; nothing to publish."
            exit 0
          fi
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "arm64-v8a build from ${GITHUB_SHA}"
          fi
          gh release upload "$tag" dist/*.so --clobber
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title latest --notes "Rolling build."
          fi
          gh release upload latest dist/*.so --clobber
          gh release edit latest --notes "Rolling; newest immutable tag: $tag"
          echo "$tag"
